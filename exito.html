<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exito</title>
</head>
<body>
    <!-- Header Sabor a Hogar -->
    <header class="bg-red-600 text-white">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
    </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
    <!-- Mensaje de Exito -->
    <h2 class="text-2xl font-semibold mt-6 text-green-600">¡Tu pedido se realizo exitosamente!</h2>
    <p class="mt-4 text-lg text-gray-700">Tu orden ya entro a nuestra cocina y esta siendo preparado.</p>
    
    <!-- Botones de Accion final con la estructura del catalogo -->
    <div class="mt-8 flex gap-4">
        <!-- Boton Principal -->
        <button
        class="h-10 bg-red-600 rounded-md px-6 py-2 font-semibold text-white cursor-pointer"
        type="button"
        >
        Pedir otro encargo
        </button>
        <!-- Boton Secundario -->
        <button
        class="h-10 border border-gray-400 rounded-md px-6 py-2 font-semibold text-black hover:bg-gray-100 cursor-pointer"
        type="button"
        >
        Volver al menu principal
        </button>
    </div>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
