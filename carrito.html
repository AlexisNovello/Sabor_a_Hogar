<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu carrito | Sabor a Hogar</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- Header Sabor a Hogar -->
    <header class="bg-red-600 text-white">
      <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <a
          href="index.html"
          class="h-10 bg-red-700 rounded-md px-4 py-2 font-semibold text-white cursor-pointer hover:bg-red-800"
        >
          Volver al Menu
        </a>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <h2 class="text-2xl font-semibold mt-6">Mi Carrito</h2>
      <a id="ver-mis-pedidos" href="mis-pedidos.html" class="hidden mt-4 inline-block rounded-md bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700">Ver mis pedidos</a>
      <p id="mensaje-pedido" class="mt-4 text-sm empty:hidden" role="status" aria-live="polite"></p>

      <!-- Lista de Productos en el Carrito -->
      <div id="lista-carrito" class="mt-6 grid grid-cols-3 gap-6"></div>

      <!-- Método de entrega y resumen del pedido -->
      <div
        class="mt-8 border-t border-gray-300 pt-6 flex flex-col gap-6 sm:flex-row sm:items-start sm:justify-end sm:gap-12"
      >
        <fieldset class="min-w-0">
          <legend class="text-xl font-semibold text-gray-600 mb-3">
            Método de entrega
          </legend>

          <div class="flex flex-col gap-4 text-xl">
            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="radio"
                name="metodo-entrega"
                value="domicilio"
                class="h-5 w-5 accent-red-600"
                disabled
              />
              Envío a domicilio
            </label>

            <label class="flex items-center gap-3 cursor-pointer">
              <input
                type="radio"
                name="metodo-entrega"
                value="retiro"
                class="h-5 w-5 accent-red-600"
                checked
              />
              Retiro en el local
            </label>
          </div>
        </fieldset>

        <div class="flex flex-col items-end gap-3 shrink-0">
          <div class="text-right">
            <span class="block text-xl font-semibold text-gray-600">
              Total:
            </span>
            <p
              id="total-carrito"
              class="text-3xl font-extrabold text-gray-900 mt-1"
            ></p>
          </div>

          <button
            id="confirmar-pedido"
            class="h-10 bg-red-600 rounded-md px-6 py-2 font-semibold text-white hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed"
            type="button"
          >
            Confirmar pedido
          </button>
        </div>
      </div>

      <template id="plantilla-item-carrito">
        <article class="border rounded-lg p-4 flex flex-col">
          <img data-foto class="w-full h-64 object-cover rounded-md" />
          <h3 data-nombre class="text-xl font-bold mt-4"></h3>
          <p data-descripcion class="mt-4"></p>
          <div class="mt-auto pt-4 flex justify-between items-center gap-4">
            <p data-precio class="text-xl font-bold"></p>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-gray-600">Cant:</span>
              <span class="inline-flex h-10 items-center rounded-md border border-gray-400 overflow-hidden bg-white">
                <button data-restar type="button" aria-label="Disminuir porciones" class="h-full w-9 flex items-center justify-center hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6" /></svg></button>
                <input data-input-cantidad type="number" min="1" step="1" value="1" aria-label="Cantidad de porciones" class="cantidad-porciones h-full w-12 text-center outline-none focus:bg-gray-50 disabled:opacity-60" />
                <button data-sumar type="button" aria-label="Aumentar porciones" class="h-full w-9 flex items-center justify-center hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed"><svg aria-hidden="true" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6" /></svg></button>
              </span>
            </div>
          </div>
          <button
            data-quitar
            class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white cursor-pointer hover:bg-red-700"
            type="button"
          >
            Quitar
          </button>
        </article>
      </template>
    </main>

    <script type="module" src="src/carrito.js"></script>
  </body>
</html>
