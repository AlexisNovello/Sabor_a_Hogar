<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de usuarios | Sabor a Hogar</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <!-- Header Sabor a Hogar - Administrador -->
    <header class="bg-red-600 text-white">
      <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <a
          href="administrador.html"
          class="h-10 bg-red-700 rounded-md px-4 py-2 font-semibold text-white hover:bg-red-800"
        >
          Volver al panel
        </a>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <!-- Titulo de la sección -->
      <h2 class="text-2xl font-semibold mt-6">Control de Usuarios</h2>
      <p class="text-gray-600 text-sm mt-1">
        Consulta los datos de los usuarios y bloquea o desbloquea clientes.
      </p>

      <!-- Grilla de Usuarios -->
      <div
        id="lista-usuarios-admin"
        class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"
      ></div>

      <!-- Plantilla para cada usuario -->
      <template id="plantilla-usuario-admin">
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
          <h3 data-nombre-usuario class="text-xl font-bold text-gray-900"></h3>
          <p
            data-email-usuario
            class="text-sm text-gray-600 mt-1 break-all"
          ></p>
          <p data-rol-usuario class="text-sm text-gray-600 mt-1"></p>
          <p data-estado-usuario class="text-sm font-semibold mt-2"></p>

          <div class="mt-6 flex flex-col gap-2">
            <button
              data-ver-datos
              class="w-full h-10 bg-black text-white rounded-md font-semibold cursor-pointer hover:bg-gray-900"
              type="button"
              aria-expanded="false"
            >
              Ver los datos
            </button>

            <button
              data-bloquear-usuario
              class="hidden w-full h-10 text-white rounded-md font-semibold cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
              type="button"
            >
              Bloquear cuenta
            </button>
          </div>

          <!-- Datos que se muestran al presionar el botón -->
          <div data-datos-usuario class="hidden mt-4 space-y-2 text-sm">
            <p>
              <span class="font-bold">DNI:</span>
              <span data-dni-usuario></span>
            </p>
            <p>
              <span class="font-bold">Teléfono:</span>
              <span data-telefono-usuario></span>
            </p>
            <p>
              <span class="font-bold">Dirección:</span>
              <span data-direccion-usuario></span>
            </p>
          </div>
        </article>
      </template>
    </main>

    <script type="module" src="src/admin-usuarios.js"></script>
  </body>
</html>
