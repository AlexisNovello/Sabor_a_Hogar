<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>entrega</title>
</head>
<body>
    <!-- Header Sabor a Hogar -->
    <header class="bg-red-600 text-white">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <!-- Boton superior derecho para regresar a la carta principal -->
        <button class="h-10 bg-red-700 rounded-md px-4 py-2 font-semibold text-white cursor-pointer" type="button">
        Volver al Menu
        </button>
    </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
    <!-- Titulo de la seccion -->
    <h2 class="text-2xl font-semibold mt-6">Metodo de entrega</h2>
    
    <!-- Contenedor de opciones -->
    <div class="mt-6 flex flex-col gap-4 max-w-md">
        
        <!-- Opcion 1: A domicilio -->
        <label class="border border-gray-400 rounded-md p-4 flex items-center gap-3 cursor-pointer bg-white">
        <input type="radio" name="metodo-entrega" value="domicilio" class="h-5 w-5 accent-red-600" checked />
        <div>
            <span class="block text-lg font-bold">Envío a domicilio</span>
        </div>
        </label>

        <!-- Opcion 2: Retiro en el local -->
        <label class="border border-gray-400 rounded-md p-4 flex items-center gap-3 cursor-pointer bg-white">
        <input type="radio" name="metodo-entrega" value="retiro" class="h-5 w-5 accent-red-600" />
        <div>
            <span class="block text-lg font-bold">Pasar a retirar</span>
        </div>
        </label>

        <!-- Boton Confirmar -->
        <button
        class="mt-2 h-10 bg-red-600 rounded-md px-4 py-2 font-semibold text-white text-center cursor-pointer"
        type="button"
        >
        Confirmar
        </button>
    </div>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
