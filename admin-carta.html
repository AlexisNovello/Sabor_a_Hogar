<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de la carta | Sabor a Hogar</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header class="bg-red-600 text-white">
      <div class="max-w-6xl mx-auto p-6 flex justify-between items-center gap-4">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <a href="administrador.html" class="rounded-md bg-red-700 px-4 py-2 font-semibold hover:bg-red-800">Volver al panel</a>
      </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">
      <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-semibold">Control de la Carta</h2>
          <p class="text-gray-600 text-sm mt-1">Editá o añadí tus platos al menú principal.</p>
        </div>
        <a href="admin-plato.html" class="rounded-md bg-red-600 px-6 py-2 font-semibold text-white hover:bg-red-700">Añadir</a>
      </div>
      <p id="mensaje-carta" class="mt-6 text-gray-600" role="status" aria-live="polite">Cargando productos...</p>
      <div id="lista-carta-admin" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <template id="plantilla-item-carta-admin">
        <article class="min-w-0 border rounded-lg p-4 flex flex-col bg-white shadow-sm">
          <div class="h-56 overflow-hidden rounded-md bg-gray-100">
            <img data-foto class="w-full h-full object-cover" loading="lazy" />
            <p data-sin-foto class="hidden h-full items-center justify-center text-gray-500 text-sm">Imagen no disponible</p>
          </div>
          <h3 data-nombre class="text-xl font-bold mt-4 break-words"></h3>
          <p data-precio class="mt-auto pt-4 text-xl font-bold text-gray-900"></p>
          <a data-editar class="mt-4 w-full text-center bg-red-600 rounded-md py-2 font-semibold text-white hover:bg-red-700">Editar</a>
          <!-- Publicación del plato en la carta del cliente -->
          <p data-publicacion class="mt-3 text-sm font-semibold"></p>
          <button data-cambiar-publicacion type="button" class="mt-3 w-full border border-gray-400 rounded-md py-2 font-semibold hover:bg-gray-100 disabled:opacity-50 cursor-pointer">
            Retirar de la carta
          </button>
        </article>
      </template>
    </main>
    <script type="module" src="src/admin-carta.js"></script>
  </body>
</html>
