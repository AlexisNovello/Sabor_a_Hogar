<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>controldeusuarios</title>
</head>
<body>
    <!-- Header Sabor a Hogar - Administrador -->
    <header class="bg-red-600 text-white">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <button class="h-10 bg-red-700 hover:bg-red-800 rounded-md px-4 py-2 font-semibold text-white cursor-pointer" type="button">
        Volver al Inicio
        </button>
    </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
    <!-- Titulo del panel de usuarios -->
    <h2 class="text-2xl font-semibold mt-6">Control de Usuarios</h2>
    <p class="text-gray-600 text-sm mt-1">Controla las cuentas de los clientes registrados, sus perfiles o aplica bloqueos.</p>
    
    <!-- Grilla de Usuarios -->
    <div id="lista-usuarios-admin" class="mt-6 grid grid-cols-3 gap-6">
        
        <!-- Usuario 1 -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
        <h3 class="text-xl font-bold text-gray-900">Alexis Novello</h3>
        <p class="text-sm text-gray-600 mt-1">alexis.novello@email.com</p>
        
        <!-- Botones para la accion requeridos -->
        <div class="mt-6 flex flex-col gap-2">
            <button class="w-full h-10 bg-black text-white rounded-md font-semibold cursor-pointer hover:bg-gray-900 transition-colors" type="button">
            Ver los datos
            </button>
            <button class="w-full h-10 bg-red-600 text-white rounded-md font-semibold cursor-pointer hover:bg-red-700 transition-colors" type="button">
            Desbloquear
            </button>
        </div>
        </article>

        <!-- Usuario 2 -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
        <h3 class="text-xl font-bold text-gray-900">Mariana Lopez</h3>
        <p class="text-sm text-gray-600 mt-1">mariana.lopez@email.com</p>
        
        <div class="mt-6 flex flex-col gap-2">
            <button class="w-full h-10 bg-black text-white rounded-md font-semibold cursor-pointer hover:bg-gray-900 transition-colors" type="button">
            Ver los datos
            </button>
            <button class="w-full h-10 bg-red-600 text-white rounded-md font-semibold cursor-pointer hover:bg-red-700 transition-colors" type="button">
            Bloquear Cuenta
            </button>
        </div>
        </article>

        <!-- Usuario 3 -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
        <h3 class="text-xl font-bold text-gray-900">Carlos Mendoza</h3>
        <p class="text-sm text-gray-600 mt-1">carlos.mendaoza@email.com</p>
        
        <div class="mt-6 flex flex-col gap-2">
            <button class="w-full h-10 bg-black text-white rounded-md font-semibold cursor-pointer hover:bg-gray-900 transition-colors" type="button">
            Ver los datos
            </button>
            <button class="w-full h-10 bg-red-600 text-white rounded-md font-semibold cursor-pointer hover:bg-red-700 transition-colors" type="button">
            Bloquear cuenta
            </button>
        </div>
        </article>

    </div>

    <template id="plantilla-usuario-admin">
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
        <h3 data-nombre-usuario class="text-xl font-bold text-gray-900"></h3>
        <p data-email-usuario class="text-sm text-gray-600 mt-1"></p>
        
        <div class="mt-6 flex flex-col gap-2">
            <button class="w-full h-10 bg-black text-white rounded-md font-semibold" type="button">
            Ver los datos
            </button>
            <button class="w-full h-10 bg-red-600 text-white rounded-md font-semibold" type="button">
            Bloquear cuenta
            </button>
        </div>
        </article>
    </template>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
