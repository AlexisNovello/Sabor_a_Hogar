<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sabor-a-hogar</title>
    <!-- Script de Tailwind para visualizar el diseño inmediatamente -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <!-- Header Sabor a Hogar con el Carrito arriba a la derecha -->
    <header class="bg-red-600 text-white">
      <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        
        <!-- Botón con el icono del carrito -->
        <button class="h-10 w-10 bg-red-700 hover:bg-red-800 rounded-md font-semibold text-white flex items-center justify-center text-lg cursor-pointer transition-colors" type="button" id="btn-carrito-header" title="Ver Carrito">
          <i class="fa-solid fa-shopping-cart"></i>
        </button>
      </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">
      <!-- Buscar productos -->
      <h2 class="text-2xl font-semibold mt-6">Nuestra carta</h2>
      <div class="mt-6 flex items-end gap-3">
        <div>
          <label class="block text-sm font-semibold" for="buscar-productos"
            >Buscar productos</label
          >
          <input
            class="mt-2 h-10 w-96 border border-gray-400 rounded-md px-4 py-2"
            id="buscar-productos"
            type="search"
            placeholder="Ej: hamburguesa"
          />
        </div>
        <button
          class="h-10 bg-red-600 rounded-md px-4 py-2 font-semibold text-white"
          type="button"
        >
          Buscar
        </button>
      </div>
      <!-- Lista de Productos -->
      <div id="lista-productos" class="mt-6 grid grid-cols-3 gap-6"></div>
      <!-- Plantilla de cada producto -->
      <template id="plantilla-producto">
        <article class="border rounded-lg p-4 flex flex-col">
          <img data-foto class="w-full h-64 object-cover" />
          <h3 data-nombre class="text-xl font-bold mt-4"></h3>
          <p data-descripcion class="mt-4"></p>
          <p data-precio class="mt-auto pt-4 text-xl font-bold"></p>
          <p
            data-estado
            class="self-start mt-4 text-sm bg-green-100 text-green-800 rounded-md inline-block px-3 py-1"
          ></p>
          <button
            class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white"
          >
            Agregar
          </button>
        </article>
      </template>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
