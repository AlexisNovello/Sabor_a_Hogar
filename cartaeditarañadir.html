<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>controlcartaañadir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Header Sabor a Hogar - Administrador -->
    <header class="bg-red-600 text-white">
    <div class="max-w-6xl mx-auto p-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold">Sabor a Hogar</h1>
        <button class="h-10 bg-red-700 hover:bg-red-800 rounded-md px-4 py-2 font-semibold text-white cursor-pointer" type="button">
        Volver al Inicio
        </button>
    </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
    <h2 class="text-2xl font-semibold mt-6">Control de la Carta</h2>
    <p class="text-gray-600 text-sm mt-1">Edita o añadi tus nuevos platos al menu principal.</p>
    
    <!-- Contenedor principal -->
    <div class="mt-6 flex items-center gap-4">
        
        <!-- Flecha Izquierda -->
        <button class="h-12 w-12 border border-gray-400 bg-white hover:bg-gray-100 rounded-md flex items-center justify-center text-gray-800 font-black text-xl cursor-pointer shadow-sm transition-colors" type="button" title="Anteriores">
        <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Grilla de los 3 Productos de la Carta -->
        <div id="lista-carta-admin" class="grid grid-cols-3 gap-6 flex-grow">
        
        <!-- Plato 1: Hamburguesa -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
            <img src="" class="w-full h-64 object-cover rounded-md" alt="Hamburguesa Completa" />
            <h3 class="text-xl font-bold mt-4">Hamburguesa Completa</h3>
            <p class="mt-2 pt-2 text-xl font-bold text-gray-900">$4.500</p>
            <button class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white cursor-pointer hover:bg-red-700" type="button">
            Editar
            </button>
        </article>

        <!-- Plato 2: Pizza -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
            <img src="" class="w-full h-64 object-cover rounded-md" alt="Pizza de Muzzarella" />
            <h3 class="text-xl font-bold mt-4">Pizza de Muzzarella</h3>
            <p class="mt-2 pt-2 text-xl font-bold text-gray-900">$6.000</p>
            <button class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white cursor-pointer hover:bg-red-700" type="button">
            Editar
            </button>
        </article>

        <!-- Plato 3: Empanadas -->
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
            <img src="" class="w-full h-64 object-cover rounded-md" alt="Empanadas Criollas" />
            <h3 class="text-xl font-bold mt-4">Empanadas Criollas</h3>
            <p class="mt-2 pt-2 text-xl font-bold text-gray-900">$2.800</p>
            <button class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white cursor-pointer hover:bg-red-700" type="button">
            Editar
            </button>
        </article>

        </div>

        <!-- Flecha Derecha -->
        <button class="h-12 w-12 border border-gray-400 bg-white hover:bg-gray-100 rounded-md flex items-center justify-center text-gray-800 font-black text-xl cursor-pointer shadow-sm transition-colors" type="button" title="Siguientes">
        <i class="fa-solid fa-chevron-right"></i>
        </button>

    </div>
    
    <!-- Bloque con el Total acumulado de la carta y el Boton de añadir -->
    <div class="mt-8 border-t border-gray-300 pt-6 flex justify-between items-end">
        <div class="text-left">
        <span class="block text-sm font-semibold text-gray-600">Total:</span>
        <p id="total-carta" class="text-3xl font-extrabold text-gray-900 mt-1">$13.300</p>
        </div>
        <button class="h-10 bg-red-600 rounded-md px-6 py-2 font-semibold text-white cursor-pointer hover:bg-red-700" type="button">
        Añadir
        </button>
    </div>

    <template id="plantilla-item-carta-admin">
        <article class="border rounded-lg p-4 flex flex-col bg-white shadow-sm">
        <img data-foto class="w-full h-64 object-cover rounded-md" />
        <h3 data-nombre class="text-xl font-bold mt-4"></h3>
        <p data-precio class="mt-2 pt-2 text-xl font-bold text-gray-900"></p>
        <button class="mt-4 w-full bg-red-600 rounded-md py-2 font-semibold text-white" type="button">
            Editar
        </button>
        </article>
    </template>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
